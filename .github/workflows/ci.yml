name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fetch the HTS (public domain; best effort so the data-dependent tests run)
        continue-on-error: true
        run: python data/fetch_hts.py
      - name: Test
        run: pytest -q

  diagrams:
    name: Architecture diagrams are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the .drawio sources
        run: python docs/architecture/build_diagrams.py
      - name: Fail if they differ from the committed files
        run: git diff --exit-code -- docs/architecture/*.drawio
