[project]
name = "tariff-trail"
version = "0.1.0"
description = "An agent that classifies products into US tariff (HTS) codes by walking the official tariff tree with Strands Decider 2B and Amazon Bedrock"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "strands-agents>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tariff_trail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
